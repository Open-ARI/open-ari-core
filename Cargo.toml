[workspace]
members = ["crates/openari-core", "crates/openari-ffi", "crates/arictl"]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["ncdents, LLC."]
repository = "https://github.com/open-ari/open-ari-core"
homepage = "https://openari.org"
publish = false

[workspace.dependencies]
openari-core = { path = "crates/openari-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dist]
inherits = "release"
