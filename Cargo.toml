[workspace]
members = [
    "crates/openari-core",
    "crates/openari-crypto",
    "crates/openari-ffi",
    "crates/openari-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0-dev.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
authors = ["ncdents, LLC."]
repository = "https://github.com/open-ari/open-ari-core"
homepage = "https://openari.org"
publish = false

[workspace.dependencies]
openari-core = { path = "crates/openari-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ml-dsa = { version = "0.1.1", default-features = false }
rsa = { version = "0.9.10", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
cms = { version = "0.2.3", default-features = false }
der = { version = "0.7.10", default-features = false, features = ["alloc", "derive", "oid"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
x509-cert = { version = "0.2.5", default-features = false }
x509-tsp = { version = "0.1.0", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
overflow-checks = true

[profile.dist]
inherits = "release"
