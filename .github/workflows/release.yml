# Publishing is deferred. See docs/releases.md.
name: Release plan
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup show
      - name: Install pinned dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fLsS https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-x86_64-unknown-linux-gnu.tar.xz -o "$RUNNER_TEMP/dist.tar.xz"
          echo "4b3f0a5f0ebbdb798f6db649d01b32ba1518376b6f7a0502b7d92b75cc2c8293  $RUNNER_TEMP/dist.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/openari-dist"
          tar -xf "$RUNNER_TEMP/dist.tar.xz" --strip-components=1 -C "$RUNNER_TEMP/openari-dist"
      - name: Validate release plan
        shell: bash
        run: '"$RUNNER_TEMP/openari-dist/dist" plan'
